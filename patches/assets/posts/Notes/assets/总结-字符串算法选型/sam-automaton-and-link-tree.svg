<path class="edge" d="M230 428 L230 512"/><text class="el" x="244" y="477">a</text>
<path class="edge" d="M230 608 L230 692"/><text class="el" x="244" y="657">n</text>
<path class="edge" d="M230 788 L230 872"/><text class="el" x="244" y="837">a</text>
<path class="edge" d="M278 920 L432 920"/><text class="el" x="350" y="907">n</text>
<path class="edge" d="M548 920 L672 920"/><text class="el" x="603" y="907">a</text>
<path class="edge" d="M548 400 C610 438 663 488 692 529"/><text class="el" x="615" y="461">n</text>
<path class="edge" d="M720 608 L720 692"/><text class="el" x="734" y="657">a</text>
<path class="edge" d="M675 720 C620 765 559 829 521 875"/><text class="el" x="593" y="806">n</text>

<!-- State nodes show id and len. -->
<g><circle class="node" cx="500" cy="200" r="48"/><text class="nt" x="500" y="193"><tspan x="500">1</tspan><tspan x="500" dy="24">len 0</tspan></text></g>
<g><circle class="node" cx="230" cy="380" r="48"/><text class="nt" x="230" y="373"><tspan x="230">2</tspan><tspan x="230" dy="24">len 1</tspan></text></g>
<g><circle class="node" cx="230" cy="560" r="48"/><text class="nt" x="230" y="553"><tspan x="230">3</tspan><tspan x="230" dy="24">len 2</tspan></text></g>
<g><circle class="node" cx="230" cy="740" r="48"/><text class="nt" x="230" y="733"><tspan x="230">4</tspan><tspan x="230" dy="24">len 3</tspan></text></g>
<g><circle class="node" cx="230" cy="920" r="48"/><text class="nt" x="230" y="913"><tspan x="230">5</tspan><tspan x="230" dy="24">len 4</tspan></text></g>
<g><circle class="clone" cx="500" cy="380" r="48"/><text class="nt" x="500" y="373"><tspan x="500">6 · C</tspan><tspan x="500" dy="24">len 1</tspan></text></g>
<g><circle class="node" cx="480" cy="920" r="48"/><text class="nt" x="480" y="913"><tspan x="480">7</tspan><tspan x="480" dy="24">len 5</tspan></text></g>
<g><circle class="clone" cx="720" cy="560" r="48"/><text class="nt" x="720" y="553"><tspan x="720">8 · C</tspan><tspan x="720" dy="24">len 2</tspan></text></g>
<g><circle class="node" cx="720" cy="920" r="48"/><text class="nt" x="720" y="913"><tspan x="720">9</tspan><tspan x="720" dy="24">len 6</tspan></text></g>
<g><circle class="clone" cx="720" cy="740" r="48"/><text class="nt" x="720" y="733"><tspan x="720">10 · C</tspan><tspan x="720" dy="24">len 3</tspan></text></g>

<text class="small" x="790" y="250">字符边</text>
<text class="tiny" x="790" y="281">1:a→6, b→2, n→8</text><text class="tiny" x="790" y="310">2:a→3　3:n→4</text>
<text class="tiny" x="790" y="339">4:a→5　5:n→7</text><text class="tiny" x="790" y="368">6:n→8　8:a→10</text>
<text class="tiny" x="790" y="397">10:n→7　7:a→9</text>
<text class="small" x="790" y="447">后缀链接</text>
<text class="tiny" x="790" y="478">2,6,8→1　3→6</text><text class="tiny" x="790" y="507">4,7→8　5,9→10</text>
<text class="tiny" x="790" y="536">10→6</text>
<text class="small" x="790" y="590">状态长度段</text>
<text class="tiny" x="790" y="621">len[link[v]]+1 .. len[v]</text>
<text class="tiny" x="790" y="666">转移图无环；每条边令 len 增大。</text>

<!-- Suffix-link tree: edge link[v] -> v. -->
<text class="title" x="1180" y="75">② 后缀链接树</text>
<text class="sub" x="1180" y="110">树边 link[v] → v；祖先、后代表示后缀等价类关系</text>
<text class="sub" x="1180" y="140">v≠1：子树权值和 = cnt[v] = |endpos[v]|；根只作汇总</text>
<path class="edge" d="M1515 240 L1305 322"/><path class="edge" d="M1550 248 L1550 322"/><path class="edge" d="M1586 240 L1800 322"/>
<path class="edge" d="M1520 420 C1495 455 1475 478 1460 492"/><path class="edge" d="M1580 420 C1605 455 1625 478 1640 492"/>
<path class="edge" d="M1800 420 C1780 455 1760 478 1748 492"/><path class="edge" d="M1840 414 C1880 454 1900 473 1910 492"/>
<path class="edge" d="M1635 588 C1605 634 1580 659 1570 672"/><path class="edge" d="M1665 588 C1690 634 1712 659 1725 672"/>
<g><circle class="node" cx="1550" cy="200" r="48"/><text class="nt" x="1550" y="193"><tspan x="1550">1</tspan><tspan x="1550" dy="24">len 0</tspan></text></g>
<g><circle class="node" cx="1270" cy="370" r="48"/><text class="nt" x="1270" y="363"><tspan x="1270">2</tspan><tspan x="1270" dy="24">len 1</tspan></text></g>
<g><circle class="clone" cx="1550" cy="370" r="48"/><text class="nt" x="1550" y="363"><tspan x="1550">6 · C</tspan><tspan x="1550" dy="24">len 1</tspan></text></g>
<g><circle class="clone" cx="1830" cy="370" r="48"/><text class="nt" x="1830" y="363"><tspan x="1830">8 · C</tspan><tspan x="1830" dy="24">len 2</tspan></text></g>
<g><circle class="node" cx="1450" cy="540" r="48"/><text class="nt" x="1450" y="533"><tspan x="1450">3</tspan><tspan x="1450" dy="24">len 2</tspan></text></g>
<g><circle class="clone" cx="1650" cy="540" r="48"/><text class="nt" x="1650" y="533"><tspan x="1650">10 · C</tspan><tspan x="1650" dy="24">len 3</tspan></text></g>
<g><circle class="node" cx="1750" cy="540" r="48"/><text class="nt" x="1750" y="533"><tspan x="1750">4</tspan><tspan x="1750" dy="24">len 3</tspan></text></g>
<g><circle class="node" cx="1910" cy="540" r="48"/><text class="nt" x="1910" y="533"><tspan x="1910">7</tspan><tspan x="1910" dy="24">len 5</tspan></text></g>
<g><circle class="node" cx="1570" cy="720" r="48"/><text class="nt" x="1570" y="713"><tspan x="1570">5</tspan><tspan x="1570" dy="24">len 4</tspan></text></g>
<g><circle class="node" cx="1730" cy="720" r="48"/><text class="nt" x="1730" y="713"><tspan x="1730">9</tspan><tspan x="1730" dy="24">len 6</tspan></text></g>
<text class="tiny" x="1180" y="805">状态 | 长度段 | 代表串 | endpos</text>
<text class="tiny" x="1180" y="839">2 | 1..1 | b | {1}</text><text class="tiny" x="1180" y="873">3 | 2..2 | ba | {2}</text>
<text class="tiny" x="1180" y="907">5 | 4..4 | bana | {4}</text><text class="tiny" x="1180" y="941">6 C | 1..1 | a | {2,4,6}</text>
<text class="tiny" x="1180" y="975">10 C | 2..3 | ana | {4,6}</text>
<text class="tiny" x="1600" y="805">状态 | 长度段 | 代表串 | endpos</text>
<text class="tiny" x="1600" y="839">4 | 3..3 | ban | {3}</text><text class="tiny" x="1600" y="873">7 | 3..5 | banan | {5}</text>
<text class="tiny" x="1600" y="907">8 C | 1..2 | an | {3,5}</text><text class="tiny" x="1600" y="941">9 | 4..6 | banana | {6}</text>
<text class="tiny" x="1600" y="975">C = Clone</text>

<!-- Build and query examples -->
<rect class="panel" x="20" y="1040" width="1960" height="440" rx="18"/>
<text class="title" x="55" y="1095">③ Clone 构造步骤与查询例子</text>
<rect class="card" x="55" y="1120" width="590" height="180" rx="12"/><rect class="card" x="705" y="1120" width="590" height="180" rx="12"/><rect class="card" x="1355" y="1120" width="590" height="180" rx="12"/>
<text class="tiny" x="80" y="1155">位置 4 追加 a：cur=5；从 p=4 沿 link 到 p=1</text><text class="tiny" x="80" y="1187">在 p=1 读到 q=3（q 表示 ba，len=2）</text><text class="tiny" x="80" y="1219">Clone 6 ← q=3：复制 q 的转移与 link[3]</text><text class="tiny" x="80" y="1251">设 len[6]=len[1]+1=1；link[3]=link[5]=6</text><text class="tiny" x="80" y="1283">把 1 -a→ 3 改成 1 -a→ 6</text>
<text class="tiny" x="730" y="1155">位置 5 追加 n：cur=7；从 p=5 沿 link 到 p=6</text><text class="tiny" x="730" y="1187">在 p=6 读到 q=4（q 表示 ban，len=3）</text><text class="tiny" x="730" y="1219">Clone 8 ← q=4：复制 q 的转移与 link[4]</text><text class="tiny" x="730" y="1251">设 len[8]=len[6]+1=2；link[4]=link[7]=8</text><text class="tiny" x="730" y="1283">把 6 -n→ 4 改成 6 -n→ 8</text>
<text class="tiny" x="1380" y="1155">位置 6 追加 a：cur=9；从 p=7 沿 link 到 p=8</text><text class="tiny" x="1380" y="1187">在 p=8 读到 q=5（q 表示 bana，len=4）</text><text class="tiny" x="1380" y="1219">Clone 10 ← q=5：复制 q 的转移与 link[5]</text><text class="tiny" x="1380" y="1251">设 len[10]=len[8]+1=3；link[5]=link[9]=10</text><text class="tiny" x="1380" y="1283">把 8 -a→ 5 改成 8 -a→ 10</text>
<text class="body" x="65" y="1360">前缀状态 last[1..6]：2,3,4,5,7,9。普通前缀状态权值 1，Clone 权值 0；按 len 降序累加，根只作汇总。</text>
<text class="body" x="65" y="1415">ana：1 -a→ 6 -n→ 8 -a→ 10；na 也到状态 10，cnt[10]=2。不同子串数 Σ_{v&gt;1}(len[v]−len[link[v]])=15。</text>
</svg>
