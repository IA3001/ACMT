<path class="link" d="M480 872 C505 738 632 625 685 606"/><!-- 7 -> 8 -->
<path class="link" d="M720 872 L720 790"/><!-- 9 -> 10 -->
<path class="link" d="M685 700 C640 600 564 475 528 427"/><!-- 10 -> 6 -->

