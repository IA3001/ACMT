<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#354b62"/></marker>
  <marker id="l" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7048"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1d2a38}
    .title{font-size:40px;font-weight:700}.sub{font-size:22px;fill:#526579}.body{font-size:24px}.small{font-size:20px}.tiny{font-size:18px}
    .panel{fill:#fff;stroke:#cbd5df;stroke-width:2}.node{fill:#f7faff;stroke:#344b63;stroke-width:3}.clone{fill:#fff4e8;stroke:#b9784d;stroke-width:3}.nt{font-size:21px;font-weight:650;text-anchor:middle}.edge{fill:none;stroke:#344b63;stroke-width:3;marker-end:url(#a)}.link{fill:none;stroke:#bd7048;stroke-width:2.5;stroke-dasharray:9 8;marker-end:url(#l)}.el{font-size:21px;font-weight:700;fill:#344b63}.card{fill:#f8fafc;stroke:#d4dde6;stroke-width:2}
  </style>
</defs>
<rect width="2000" height="1500" fill="#f3f6fa"/>
<rect class="panel" x="20" y="20" width="1100" height="1000" rx="18"/>
<rect class="panel" x="1140" y="20" width="840" height="1000" rx="18"/>
<text class="title" x="55" y="75">① SAM 自动机状态图</text>
<line class="edge" x1="560" y1="66" x2="630" y2="66"/><text class="sub" x="645" y="74">字符转移</text>
<line class="link" x1="785" y1="66" x2="855" y2="66"/><text class="sub" x="870" y="74">v → link[v]</text>
<text class="sub" x="55" y="112">Text = banana；橙色节点为 Clone；虚线箭头从状态指向它的 suffix link</text>

