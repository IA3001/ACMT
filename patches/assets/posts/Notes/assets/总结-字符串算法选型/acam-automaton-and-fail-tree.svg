<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500">
<defs>
  <marker id="solidArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#25364a"/></marker>
  <marker id="failArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c34232"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182433}
    .title{font-size:40px;font-weight:700}.sub{font-size:23px;fill:#43566d}.nodeText{font-size:23px;font-weight:600;text-anchor:middle}.treeNodeText{font-size:20px;font-weight:600;text-anchor:middle}.edgeLabel{font-size:22px;font-weight:700;fill:#25364a}.body{font-size:24px}.small{font-size:21px}.panel{fill:#fff;stroke:#cbd5df;stroke-width:2}.node{fill:#f8fbff;stroke:#344b63;stroke-width:3}.end{fill:#fff8e8;stroke:#b1863a;stroke-width:3}.trie{fill:none;stroke:#344b63;stroke-width:3;marker-end:url(#solidArrow)}.fail{fill:none;stroke:#c56b58;stroke-width:2.5;stroke-dasharray:9 8;opacity:.85;marker-end:url(#failArrow)}.tree{fill:none;stroke:#708397;stroke-width:3;marker-end:url(#solidArrow)}
  </style>
</defs>
<rect width="2000" height="1500" fill="#f3f6fa"/>
