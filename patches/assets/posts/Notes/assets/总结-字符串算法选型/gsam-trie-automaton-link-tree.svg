<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1690" viewBox="0 0 2800 1690"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344b63"/></marker><marker id="barr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43835d"/></marker><marker id="linkarr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7048"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#1d2a38}.title{font-size:42px;font-weight:700}.sub{font-size:23px;fill:#526579}.head{font-size:30px;font-weight:700}.small{font-size:20px;fill:#526579}.edge{stroke:#344b63;stroke-width:3;fill:none;marker-end:url(#arr)}.aEdge{stroke:#477ab5;stroke-width:3;fill:none;marker-end:url(#arr)}.bEdge{stroke:#43835d;stroke-width:3;fill:none;marker-end:url(#barr)}.shared{stroke:#8068ae;stroke-width:3.5;fill:none;marker-end:url(#arr)}.link{stroke:#bd7048;stroke-width:3;fill:none;marker-end:url(#linkarr)}.lab{font-size:24px;font-weight:700;text-anchor:middle;paint-order:stroke;stroke:white;stroke-width:7px}.node{stroke-width:3}.aNode{fill:#eaf3ff;stroke:#477ab5}.bNode{fill:#e9f7ef;stroke:#43835d}.abNode{fill:#f0ebff;stroke:#8068ae}.clone{fill:#fff1e4;stroke:#bf7548;stroke-width:4}.nt{font-size:24px;font-weight:700;text-anchor:middle}.panel{fill:#fff;stroke:#cbd5df;stroke-width:2}.foot{font-size:22px}.terminal{font-size:18px;font-weight:700;text-anchor:middle}</style></defs><rect width="2800" height="1690" fill="#f3f6fa"/><text class="title" x="35" y="55">GSAM：Trie BFS 构造、自动机转移与 Link 树</text><text class="sub" x="35" y="88">Texts = banana、bandana。共享前缀 ban；Trie 阻止跨串拼接，BFS 扩展后产生 3 个 Clone。</text><rect class="panel" x="20" y="110" width="830" height="1330" rx="18"/><rect class="panel" x="865" y="110" width="940" height="1330" rx="18"/><rect class="panel" x="1820" y="110" width="960" height="1330" rx="18"/><text