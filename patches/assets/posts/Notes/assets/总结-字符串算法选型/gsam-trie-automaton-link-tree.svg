<text class="small" x="1855" y="970">根 1 的孩子：2、8、12、13。</text><text class="small" x="1855" y="1005">12 的孩子：3、9、14；13 的孩子：4、6、10。</text><text class="small" x="1855" y="1040">14 的孩子：5、7、11。</text><text class="small" x="1855" y="1085">状态 4 = ban：来源 A+B。</text><text class="small" x="1855" y="1120">Clone 12/13/14 分别代表 a/an/ana。</text>
<rect class="panel" x="20" y="1455" width="2760" height="220" rx="16"/><text class="head" x="50" y="1495">BFS 扩展顺序与三次 Clone</text><text class="foot" x="50" y="1530">Trie 边：1-b→2，2-a→3，3-n→4，4-a→5，4-d→8，5-n→6，8-a→9，6-a→7，9-n→10，10-a→11。</text><text class="foot" x="50" y="1567">① 扩展 4-a→5：p=1，q=3（ba，len=2）；Clone 12 ← q=3，len=1；改 1-a→3 为 1-a→12，link[3]=link[5]=12。</text><text class="foot" x="50" y="1604">② 扩展 5-n→6：p=12，q=4（ban，len=3）；Clone 13 ← q=4，len=2；改 12-n→4 为 12-n→13，link[4]=link[6]=13。</text><text class="foot" x="50" y="1641">③ 扩展 6-a→7：p=13，q=5（bana，len=4）；Clone 14 ← q=5，len=3；改 13-a→5 为 13-a→14，link[5]=link[7]=14。</text></svg>